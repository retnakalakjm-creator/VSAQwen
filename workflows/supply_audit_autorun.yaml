name: Supply Coming In Production Audit

on:
  # Allows you to manually trigger the run from the GitHub "Actions" tab
  workflow_dispatch:
  
  # Optional: Automatically runs if you push changes to the script or evidence logic
  push:
    branches:
      - main
    paths:
      - 'debug/diagnose_supply_coming_in_production_path_readiness_audit_optimized.py'
      - 'evidence/**'
      - '.github/workflows/supply_audit_autorun.yml'

jobs:
  run-audit:
    runs-on: ubuntu-latest
    
    steps:
    - name: Checkout Repository
      uses: actions/checkout@v4

    - name: Set up Python 3.11
      uses: actions/setup-python@v5
      with:
        python-version: '3.11'

    - name: Install Dependencies
      run: |
        python -m pip install --upgrade pip
        if [ -f requirements.txt ]; then pip install -r requirements.txt; fi
        # Fallback installs for common VSA/finance dependencies just in case
        pip install pandas numpy yfinance

    - name: Execute Audit & Save to Text File
      run: |
        echo "Starting SUPPLY_COMING_IN Production Path Audit..."
        # Run the script and redirect both stdout and stderr to the text file
        python debug/diagnose_supply_coming_in_production_path_readiness_audit_optimized.py > supply_audit_output.txt 2>&1
        
        echo "Audit finished. Printing output to GitHub logs for visibility:"
        cat supply_audit_output.txt

    - name: Upload Text File as Artifact
      uses: actions/upload-artifact@v4
      with:
        name: Supply-Coming-In-Audit-Results
        path: supply_audit_output.txt
        retention-days: 30