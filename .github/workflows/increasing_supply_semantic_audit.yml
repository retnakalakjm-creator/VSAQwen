name: Increasing Supply Semantic Quality Audit

on:
  # Allows you to manually trigger the run from the GitHub "Actions" tab
  workflow_dispatch:
  
  # Optional: Automatically runs if you push changes to this specific script or the evidence logic
  push:
    branches:
      - main
    paths:
      - 'debug/diagnose_increasing_supply_semantic_quality_audit_optimized.py'
      - 'evidence/**'
      - '.github/workflows/increasing_supply_semantic_audit.yml'

jobs:
  run-audit:
    runs-on: ubuntu-latest
    
    # SILENCES THE NODE 20/24 DEPRECATION WARNING
    env:
      ACTIONS_ALLOW_USE_UNSECURE_NODE_VERSION: true
      
    steps:
    - name: Checkout Repository
      uses: actions/checkout@v4

    - name: Set up Python 3.11
      uses: actions/setup-python@v5
      with:
        python-version: '3.11'

    - name: Install Dependencies
      run: |
        python -m pip install --upgrade pip
        if [ -f requirements.txt ]; then pip install -r requirements.txt; fi
        # Fallback installs for VSA/finance dependencies
        pip install pandas numpy yfinance

    - name: Execute Semantic Audit & Save to Text File
      run: |
        echo "Starting INCREASING_SUPPLY Semantic Quality Audit (Target: 528 events)..."
        # Run the script and redirect both stdout and stderr to the text file
        python debug/diagnose_increasing_supply_semantic_quality_audit_optimized.py > increasing_supply_semantic_output.txt 2>&1
        
        echo "Audit finished. Printing output to GitHub logs for visibility:"
        cat increasing_supply_semantic_output.txt

    - name: Upload Text File as Artifact
      uses: actions/upload-artifact@v4
      with:
        name: Increasing-Supply-Semantic-Results
        path: increasing_supply_semantic_output.txt
        retention-days: 30
