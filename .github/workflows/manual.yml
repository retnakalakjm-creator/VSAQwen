name: Supply Coming In Production Audit

on:
  workflow_dispatch: # Allows manual triggering from the GitHub UI
  push:
    paths:
      - 'debug/diagnose_supply_coming_in_production_path_readiness_audit_optimized.py'

jobs:
  execute-audit:
    runs-on: ubuntu-latest
    
    steps:
    - name: Checkout Code
      uses: actions/checkout@v4

    - name: Setup Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.11'

    - name: Install Dependencies
      run: |
        pip install -r requirements.txt || true
        pip install pandas numpy yfinance

    - name: Execute Script and Save to Text File
      run: |
        # This is the exact command that runs your script and creates the text file
        python debug/diagnose_supply_coming_in_production_path_readiness_audit_optimized.py > supply_audit_results.txt 2>&1
        
        echo "--- AUDIT OUTPUT ---"
        cat supply_audit_results.txt

    - name: Save Text File as Downloadable Artifact
      uses: actions/upload-artifact@v4
      with:
        name: Supply-Audit-Results
        path: supply_audit_results.txt
        retention-days: 15
